name: Release 3X-UI

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"
  release:
    types: [published]

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Test release downloader
        run: python3 -I -m unittest discover -s .github/scripts -p 'test_*.py' -v

      - name: Build 3X-UI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export CGO_ENABLED=1
          export GOOS=linux
          export GOARCH=amd64

          # Use Bootlin prebuilt cross-toolchains (musl for static build)
          BOOTLIN_ARCH="x86-64"
          echo "Resolving Bootlin musl toolchain for arch=$BOOTLIN_ARCH"
          TARBALL_BASE="https://toolchains.bootlin.com/downloads/releases/toolchains/$BOOTLIN_ARCH/tarballs/"
          TARBALL_URL=$(curl -fsSL "$TARBALL_BASE" | grep -oE "${BOOTLIN_ARCH}--musl--stable-[^\"]+\\.tar\\.xz" | sort -r | head -n1)
          [ -z "$TARBALL_URL" ] && { echo "Failed to locate Bootlin musl toolchain" >&2; exit 1; }
          echo "Downloading: $TARBALL_URL"
          cd /tmp
          curl -fL -sS -o "$(basename "$TARBALL_URL")" "$TARBALL_BASE/$TARBALL_URL"
          tar -xf "$(basename "$TARBALL_URL")"
          TOOLCHAIN_DIR=$(find . -maxdepth 1 -type d -name "${BOOTLIN_ARCH}--musl--stable-*" | head -n1)
          export PATH="$(realpath "$TOOLCHAIN_DIR")/bin:$PATH"
          export CC=$(realpath "$(find "$TOOLCHAIN_DIR/bin" -name '*-gcc.br_real' -type f -executable | head -n1)")
          [ -z "$CC" ] && { echo "No gcc.br_real found in $TOOLCHAIN_DIR/bin" >&2; exit 1; }
          cd -
          go build -ldflags "-X 'github.com/mhsanaei/3x-ui/v2/config.version=${{ github.ref_name }}' -w -s -linkmode external -extldflags '-static'" -o xui-release -v main.go
          file xui-release
          ldd xui-release || echo "Static binary confirmed"

          mkdir x-ui
          cp xui-release x-ui/
          cp x-ui.service.debian x-ui/
          cp x-ui.service.arch x-ui/
          cp x-ui.service.rhel x-ui/
          cp x-ui.sh x-ui/
          mv x-ui/xui-release x-ui/x-ui
          mkdir x-ui/bin
          cd x-ui/bin

          # 仅使用 GitHub 官方直链和资产 API；必要文件失败时中止构建。
          download() {
            python3 -I "$GITHUB_WORKSPACE/.github/scripts/download_release_asset.py" "$@"
          }

          download "XTLS/Xray-core" "v26.2.2" "Xray-linux-64.zip" "Xray-linux-64.zip"
          unzip Xray-linux-64.zip
          rm -f Xray-linux-64.zip

          rm -f geoip.dat geosite.dat
          download "Loyalsoldier/v2ray-rules-dat" "latest" "geoip.dat" "geoip.dat"
          download "Loyalsoldier/v2ray-rules-dat" "latest" "geosite.dat" "geosite.dat"
          download "chocolate4u/Iran-v2ray-rules" "latest" "geoip.dat" "geoip_IR.dat"
          download "chocolate4u/Iran-v2ray-rules" "latest" "geosite.dat" "geosite_IR.dat"
          download "runetfreedom/russia-v2ray-rules-dat" "latest" "geoip.dat" "geoip_RU.dat"
          download "runetfreedom/russia-v2ray-rules-dat" "latest" "geosite.dat" "geosite_RU.dat"
          mv xray xray-linux-amd64
          cd ../..

      - name: Package
        run: tar -zcvf x-ui-linux-amd64.tar.gz x-ui

      - name: Upload files to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: x-ui-linux-amd64
          path: ./x-ui-linux-amd64.tar.gz

      - name: Upload files to GH release
        uses: svenstaro/upload-release-action@v2
        if: |
          (github.event_name == 'release' && github.event.action == 'published') ||
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref }}
          file: x-ui-linux-amd64.tar.gz
          asset_name: x-ui-linux-amd64.tar.gz
          overwrite: true
          prerelease: false


{{define "settings/panel/subscription/general"}}
<a-collapse default-active-key="1">
    <a-collapse-panel key="1" header='{{ i18n "pages.xray.generalConfigs"}}'>
        <a-setting-list-item paddings="small">
            <template #title>{{ i18n "pages.settings.subEnable"}}</template>
            <template #description>{{ i18n "pages.settings.subEnableDesc"}}</template>
            <template #control>
                <a-switch v-model="allSetting.subEnable"></a-switch>
            </template>
        </a-setting-list-item>
        <a-setting-list-item paddings="small">
            <template #title>JSON Subscription</template>
            <template #description>{{ i18n "pages.settings.subJsonEnable"}}</template>
            <template #control>
                <a-switch v-model="allSetting.subJsonEnable"></a-switch>
            </template>
        </a-setting-list-item>
        <a-setting-list-item paddings="small">
            <template #title>{{ i18n "pages.settings.subListen"}}</template>
            <template #description>{{ i18n "pages.settings.subListenDesc"}}</template>
            <template #control>
                <a-input type="text" v-model="allSetting.subListen"></a-input>
            </template>
        </a-setting-list-item>
        <a-setting-list-item paddings="small">
            <template #title>{{ i18n "pages.settings.subDomain"}}</template>
            <template #description>{{ i18n "pages.settings.subDomainDesc"}}</template>
            <template #control>
                <a-input type="text" v-model="allSetting.subDomain"></a-input>
            </template>
        </a-setting-list-item>
        <a-setting-list-item paddings="small">
            <template #title>{{ i18n "pages.settings.subPort"}}</template>
            <template #description>{{ i18n "pages.settings.subPortDesc"}}</template>
            <template #control>
                <a-input-number v-model="allSetting.subPort" :min="1" :min="65535"
                    :style="{ width: '100%' }"></a-input-number>
            </template>
        </a-setting-list-item>
        <a-setting-list-item paddings="small">
            <template #title>{{ i18n "pages.settings.subPath"}}</template>
            <template #description>{{ i18n "pages.settings.subPathDesc"}}</template>
            <template #control>
                <a-input type="text" v-model="allSetting.subPath"
                    @input="allSetting.subPath = ((typeof $event === 'string' ? $event : ($event && $event.target ? $event.target.value : '')) || '').replace(/[:*]/g, '')"
                    @blur="allSetting.subPath = (p => { p = p || '/'; if (!p.startsWith('/')) p='/' + p; if (!p.endsWith('/')) p += '/'; return p.replace(/\/+/g,'/'); })(allSetting.subPath)"
                    placeholder="/sub/"></a-input>
            </template>
        </a-setting-list-item>
        <a-setting-list-item paddings="small">
            <template #title>{{ i18n "pages.settings.subURI"}}</template>
            <template #description>{{ i18n "pages.settings.subURIDesc"}}</template>
            <template #control>
                <a-input type="text" placeholder="(http|https)://domain[:port]/path/"
                    v-model="allSetting.subURI"></a-input>
            </template>
        </a-setting-list-item>
    </a-collapse-panel>
    <a-collapse-panel key="2" header='{{ i18n "pages.settings.information" }}'>
        <a-setting-list-item paddings="small">
            <template #title>{{ i18n "pages.settings.subEncrypt"}}</template>
            <template #description>{{ i18n "pages.settings.subEncryptDesc"}}</template>
            <template #control>
                <a-switch v-model="allSetting.subEncrypt"></a-switch>
            </template>
        </a-setting-list-item>
        <a-setting-list-item paddings="small">
            <template #title>{{ i18n "pages.settings.subShowInfo"}}</template>
            <template #description>{{ i18n "pages.settings.subShowInfoDesc"}}</template>
            <template #control>
                <a-switch v-model="allSetting.subShowInfo"></a-switch>
            </template>
        </a-setting-list-item>
        <a-divider>{{ i18n "pages.xray.basicTemplate"}}</a-divider>
        <a-setting-list-item paddings="small">
            <template #title>{{ i18n "pages.settings.subTitle"}}</template>
            <template #description>{{ i18n "pages.settings.subTitleDesc"}}</template>
            <template #control>
                <a-input type="text" v-model="allSetting.subTitle"></a-input>
            </template>
        </a-setting-list-item>
        <a-setting-list-item paddings="small">
            <template #title>{{ i18n "pages.settings.subSupportUrl"}}</template>
            <template #description>{{ i18n "pages.settings.subSupportUrlDesc"}}</template>
            <template #control>
                <a-input type="text" v-model="allSetting.subSupportUrl" placeholder="https://example.com"></a-input>
            </template>
        </a-setting-list-item>
        <a-setting-list-item paddings="small">
            <template #title>{{ i18n "pages.settings.subProfileUrl"}}</template>
            <template #description>{{ i18n "pages.settings.subProfileUrlDesc"}}</template>
            <template #control>
                <a-input type="text" v-model="allSetting.subProfileUrl" placeholder="https://example.com"></a-input>
            </template>
        </a-setting-list-item>
        <a-setting-list-item paddings="small">
            <template #title>{{ i18n "pages.settings.subAnnounce"}}</template>
            <template #description>{{ i18n "pages.settings.subAnnounceDesc"}}</template>
            <template #control>
                <a-textarea v-model="allSetting.subAnnounce"></a-textarea>
            </template>
        </a-setting-list-item>
        <a-divider>{{ i18n "pages.xray.advancedTemplate"}} (Happ)</a-divider>
        <a-setting-list-item paddings="small">
            <template #title>{{ i18n "pages.settings.subEnableRouting"}}</template>
            <template #description>{{ i18n "pages.settings.subEnableRoutingDesc"}}</template>
            <template #control>
                <a-switch v-model="allSetting.subEnableRouting"></a-switch>
            </template>
        </a-setting-list-item>
        <a-setting-list-item paddings="small">
            <template #title>{{ i18n "pages.settings.subRoutingRules"}}</template>
            <template #description>{{ i18n "pages.settings.subRoutingRulesDesc"}}</template>
            <template #control>
                <a-textarea v-model="allSetting.subRoutingRules" placeholder="happ://routing/add/..."></a-textarea>
            </template>
        </a-setting-list-item>
    </a-collapse-panel>
    <a-collapse-panel key="3" header='{{ i18n "pages.settings.certs" }}'>
        <a-setting-list-item paddings="small">
            <template #title>{{ i18n "pages.settings.subCertPath"}}</template>
            <template #description>{{ i18n "pages.settings.subCertPathDesc"}}</template>
            <template #control>
                <a-input type="text" v-model="allSetting.subCertFile"></a-input>
            </template>
        </a-setting-list-item>
        <a-setting-list-item paddings="small">
            <template #title>{{ i18n "pages.settings.subKeyPath"}}</template>
            <template #description>{{ i18n "pages.settings.subKeyPathDesc"}}</template>
            <template #control>
                <a-input type="text" v-model="allSetting.subKeyFile"></a-input>
            </template>
        </a-setting-list-item>
    </a-collapse-panel>
    <a-collapse-panel key="4" header='{{ i18n "pages.settings.intervals"}}'>
        <a-setting-list-item paddings="small">
            <template #title>{{ i18n "pages.settings.subUpdates"}}</template>
            <template #description>{{ i18n "pages.settings.subUpdatesDesc"}}</template>
            <template #control>
                <a-input-number :min="1" v-model="allSetting.subUpdates" :style="{ width: '100%' }"></a-input-number>
            </template>
        </a-setting-list-item>
    </a-collapse-panel>
    <a-collapse-panel key="5" header="Clash 订阅配置">
        <a-alert message="特别说明" description="本配置专用于 Cloudflare 优选架构，非通用订阅转换器。" type="info" show-icon
            style="margin-bottom: 20px"></a-alert>
        <a-setting-list-item paddings="small">
            <template #title>优选域名</template>
            <template #description>Clash 配置文件中节点的域名（例如：example.com），留空则使用订阅域名</template>
            <template #control>
                <a-input type="text" v-model="allSetting.clashDomain" placeholder="example.com"></a-input>
            </template>
        </a-setting-list-item>
        <a-setting-list-item paddings="small">
            <template #title>订阅域名</template>
            <template #description>生成订阅链接的域名（例如：sub.example.com），留空则使用当前访问域名</template>
            <template #control>
                <a-input type="text" v-model="allSetting.clashSubDomain" placeholder="sub.example.com"></a-input>
            </template>
        </a-setting-list-item>
        <a-setting-list-item paddings="small">
            <template #title>CDN 前缀</template>
            <template #description>CDN 子域名前缀（例如：cdn），生成节点如 1cdn, 2cdn。另外会自动生成 x + 前缀 的低速专线节点（如 xcdn）用于稳定长连接</template>
            <template #control>
                <a-input type="text" v-model="allSetting.clashPrefix" placeholder=""></a-input>
            </template>
        </a-setting-list-item>
        <a-setting-list-item paddings="small">
            <template #title>默认生成数量</template>
            <template #description>默认生成的 CDN 节点数量（建议配置10个以上）</template>
            <template #control>
                <a-input-number :min="0" :max="100" v-model="allSetting.clashCount"
                    :style="{ width: '100%' }"></a-input-number>
            </template>
        </a-setting-list-item>
        <a-setting-list-item paddings="small">
            <template #title>Rule 配置（可编辑，合并）</template>
            <template #description>一个输入框统一编辑 rule-providers 和 rules；保存时会自动拆分并同步到订阅配置</template>
            <template #control>
                <a-textarea v-model="clashRuleMerged" :rows="20" placeholder="rule-providers:
  reject:
    type: http
    behavior: domain
    url: 'https://example.com/rules/reject'
    path: ./ruleset/reject.yaml
    interval: 86400

rules:
  - 'RULE-SET,reject,REJECT'
  - 'MATCH,🎯 兜底规则'" style="font-family: monospace; width: 100%"></a-textarea>
            </template>
        </a-setting-list-item>
        <a-setting-list-item paddings="small">
            <template #title>隐藏端口 (Hide Port)</template>
            <template #description>生成订阅链接时不带端口（默认 443），适用于已配置 HTTPS 回源的情况</template>
            <template #control>
                <a-switch v-model="allSetting.clashNoPort"></a-switch>
            </template>
        </a-setting-list-item>
        <a-setting-list-item paddings="small">
            <template #title>启用三网优化节点 (xcdn)</template>
            <template #description>开启后会在生成的配置文件中为每个节点组额外生成一个带 x 前缀的节点（命名为 "组名 ⚡ 三网优选"）并优先放置在对应的负载均衡组内。同时支持根据 Wetest 优选 IP 自动更新阿里云 DNS 解析。</template>
            <template #control>
                <a-switch v-model="allSetting.clashXcdnEnabled"></a-switch>
            </template>
        </a-setting-list-item>
        <template v-if="allSetting.clashXcdnEnabled">
            <a-setting-list-item paddings="small">
                <template #title>阿里云 AccessKey ID</template>
                <template #description>用于自动更新 DNS 解析，请确保该 AK 拥有阿里云 DNS 解析的修改权限</template>
                <template #control>
                    <a-input type="text" v-model="allSetting.aliyunAk" placeholder="AccessKey ID"></a-input>
                </template>
            </a-setting-list-item>
            <a-setting-list-item paddings="small">
                <template #title>阿里云 AccessKey Secret</template>
                <template #description>阿里云 AccessKey Secret</template>
                <template #control>
                    <a-input-password v-model="allSetting.aliyunSk" placeholder="AccessKey Secret"></a-input-password>
                </template>
            </a-setting-list-item>
            <a-setting-list-item paddings="small">
                <template #title>手动更新 IP</template>
                <template #description>立即触发一次优选 IP 获取及阿里云 DNS 解析更新</template>
                <template #control>
                    <a-button type="primary" @click="updateAliyunDNS">立即更新</a-button>
                </template>
            </a-setting-list-item>
            <a-divider>DNS 状态</a-divider>
            <a-setting-list-item paddings="small">
                <template #title>刷新状态</template>
                <template #description>从阿里云获取当前 xcdn 解析记录</template>
                <template #control>
                    <a-button type="default" :loading="aliyunDnsStatusLoading" @click="fetchAliyunDNSStatus">刷新状态</a-button>
                </template>
            </a-setting-list-item>
            <a-setting-list-item paddings="small">
                <template #title>解析记录</template>
                <template #description>
                    <div v-if="aliyunDnsStatus && aliyunDnsStatus.domain">
                        记录：[[ aliyunDnsStatus.recordName ]].[[ aliyunDnsStatus.domain ]]
                        <span v-if="aliyunDnsStatus.lastUpdatedAt" style="margin-left: 8px; color: #999;">
                            更新时间：[[ aliyunDnsStatus.lastUpdatedAt ]]
                        </span>
                        <div v-if="aliyunDnsStatus.records && aliyunDnsStatus.records.length" style="margin-top: 6px; line-height: 1.6;">
                            <div v-for="(r, idx) in aliyunDnsStatus.records" :key="idx">
                                [[ aliyunDnsStatus.recordName ]].[[ aliyunDnsStatus.domain ]] [[ r.line ]] [[ r.value ]] [[ r.updateTimestamp ]]
                            </div>
                        </div>
                    </div>
                    <div v-else>暂无记录信息</div>
                </template>
                <template #control>
                    <div style="width: 100%;">
                        <a-alert v-if="aliyunDnsStatusError" type="warning" show-icon :message="aliyunDnsStatusError" style="margin-bottom: 10px;"></a-alert>
                        <a-empty v-else-if="!aliyunDnsStatus || !aliyunDnsStatus.records || aliyunDnsStatus.records.length === 0"
                            description="暂无记录" :style="{ margin: '10px 0' }" />
                    </div>
                </template>
            </a-setting-list-item>
        </template>
    </a-collapse-panel>
</a-collapse>
{{end}}
